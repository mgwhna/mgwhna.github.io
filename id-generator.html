<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generator ID Card - Analytics by MW</title>
    <link rel="icon" type="image/png" href="img/projects/logo-web.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #fcfbf7;
      }
      .bg-primary-custom {
        background-color: #556b2f !important;
      }
      .id-card-preview {
        width: 320px;
        height: 480px;
        background: linear-gradient(135deg, #556b2f, #3e4f22);
        border-radius: 16px;
        color: white;
        position: relative;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary-custom fixed-top">
      <div class="container"><a class="navbar-brand fw-bold" href="showcase.html">MEGA WAHANA SIBORO</a></div>
    </nav>
    <div class="container" style="margin-top: 120px">
      <div class="row g-5 justify-content-center align-items-center">
        <div class="col-md-5">
          <h3 class="fw-bold mb-3">Smart ID Card Generator</h3>
          <p class="text-muted small">Form pembuatan cetak kartu tanda pengenal instan dengan integrasi metadata.</p>
          <input type="text" class="form-control mb-2" placeholder="Nama Lengkap" value="Mega Wahana Siboro" />
          <input type="text" class="form-control mb-3" placeholder="Jabatan/Instansi" value="IT Support Staff" />
          <button class="btn text-white w-100" style="background-color: #556b2f"><i class="bi bi-gear-fill me-1"></i> Generate ID Card</button>
        </div>
        <div class="col-md-4 d-flex justify-content-center">
          <div class="id-card-preview p-4 text-center d-flex flex-column align-items-center justify-content-between">
            <div class="fw-bold small tracking-wider">ANALYTICS BY MW</div>
            <div class="my-3"><i class="bi bi-person-circle" style="font-size: 5rem"></i></div>
            <div>
              <h5 class="fw-bold mb-0">M. Wahana Siboro</h5>
              <p class="small text-white-50">S1 Teknik Informatika</p>
            </div>
            <div class="bg-white p-2 rounded mb-2"><i class="bi bi-qr-code text-dark fs-3"></i></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
